    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #1e293b 100%);
            min-height: 100vh;
            touch-action: manipulation;
        }

        /* Prevent auto-zoom on mobile inputs */
        @media (max-width: 640px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }

        /* Light mode translucent panels */
        html:not(.dark) body {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
        }

        /* Light mode translucent panels over background */
        html:not(.dark) .bg-white {
            background-color: rgba(255, 255, 255, 0.85) !important;
        }

        html:not(.dark) .bg-slate-50 {
            background-color: rgba(248, 250, 252, 0.7) !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Dark Mode Global Styles */
        html.dark body {
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%) !important;
            color: #f8fafc !important;
        }.sidebar-item {
            transition: all 0.2s ease;
        }

        .sidebar-item:hover,
        .sidebar-item.active {
            background-color: #ede9fe;
            color: #7c3aed;
            border-right: 3px solid #7c3aed;
        }

        /* Animation classes */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Dark Mode Overrides */
        html.dark body {
            background-color: #0f172a;
            background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
        }

        html.dark blockquote,
        html.dark pre,
        html.dark code {
            background-color: rgba(30, 41, 59, 0.7) !important;
            color: #f8fafc !important;
        }

        html.dark .bg-white {
            background-color: rgba(30, 41, 59, 0.65) !important;
        }

        html.dark .bg-slate-50 {
            background-color: rgba(15, 23, 42, 0.45) !important;
        }

        html.dark .bg-slate-100 {
            background-color: #334155 !important;
        }

        html.dark .bg-slate-900 {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }

        html.dark .text-slate-800,
        html.dark .text-slate-900 {
            color: #f8fafc !important;
        }

        html.dark .text-slate-700 {
            color: #e2e8f0 !important;
        }

        html.dark .text-slate-600 {
            color: #cbd5e1 !important;
        }

        html.dark .text-slate-500 {
            color: #94a3b8 !important;
        }

        html.dark .text-slate-400 {
            color: #64748b !important;
        }

        html.dark .border-slate-100,
        html.dark .border-gray-100 {
            border-color: #334155 !important;
        }

        html.dark .border-slate-200 {
            border-color: #475569 !important;
        }

        html.dark .border-slate-300 {
            border-color: #64748b !important;
        }

        html.dark input,
        html.dark select,
        html.dark textarea {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-color: #475569 !important;
        }

        /* Sidebar active states and hover states overrides */
        html.dark .sidebar-item:hover,
        html.dark .sidebar-item.active {
            background-color: rgba(139, 92, 246, 0.2) !important;
            color: #a78bfa !important;
        }

        html.dark .bg-violet-50,
        html.dark .bg-violet-100 {
            background-color: rgba(139, 92, 246, 0.15) !important;
            color: #c4b5fd !important;
        }

        html.dark .text-violet-600,
        html.dark .text-violet-700 {
            color: #a78bfa !important;
        }

        html.dark .bg-orange-50,
        html.dark .bg-orange-100 {
            background-color: rgba(249, 115, 22, 0.15) !important;
            color: #fdba74 !important;
        }

        html.dark .text-orange-600,
        html.dark .text-orange-700 {
            color: #fb923c !important;
        }

        html.dark .bg-blue-50,
        html.dark .bg-blue-100 {
            background-color: rgba(59, 130, 246, 0.15) !important;
            color: #93c5fd !important;
        }

        html.dark .text-blue-600,
        html.dark .text-blue-700 {
            color: #60a5fa !important;
        }

        html.dark .bg-red-50,
        html.dark .bg-red-100 {
            background-color: rgba(239, 68, 68, 0.15) !important;
            color: #fca5a5 !important;
        }

        html.dark .text-red-500,
        html.dark .text-red-600,
        html.dark .text-red-700 {
            color: #f87171 !important;
        }

        html.dark .bg-emerald-50,
        html.dark .bg-emerald-100,
        html.dark .bg-green-50,
        html.dark .bg-green-100 {
            background-color: rgba(16, 185, 129, 0.15) !important;
            color: #6ee7b7 !important;
        }

        html.dark .text-emerald-600,
        html.dark .text-emerald-700,
        html.dark .text-green-600,
        html.dark .text-green-700 {
            color: #34d399 !important;
        }

        html.dark .bg-pink-100 {
            background-color: rgba(236, 72, 153, 0.15) !important;
            color: #f9a8d4 !important;
        }

        html.dark .text-pink-600 {
            color: #f472b6 !important;
        }

        html.dark .bg-yellow-100 {
            background-color: rgba(234, 179, 8, 0.15) !important;
            color: #fde047 !important;
        }

        html.dark .text-yellow-600 {
            color: #facc15 !important;
        }

        html.dark .bg-purple-100 {
            background-color: rgba(168, 85, 247, 0.15) !important;
            color: #d8b4fe !important;
        }

        html.dark .text-purple-600 {
            color: #c084fc !important;
        }

        html.dark .bg-teal-100 {
            background-color: rgba(20, 184, 166, 0.15) !important;
            color: #5eead4 !important;
        }

        html.dark .text-teal-600 {
            color: #2dd4bf !important;
        }

        html.dark .bg-cyan-100 {
            background-color: rgba(6, 182, 212, 0.15) !important;
            color: #67e8f9 !important;
        }

        html.dark .text-cyan-600 {
            color: #22d3ee !important;
        }

        html.dark .bg-rose-100 {
            background-color: rgba(225, 29, 72, 0.15) !important;
            color: #fda4af !important;
        }

        html.dark .text-rose-600 {
            color: #fb7185 !important;
        }

        html.dark .bg-indigo-100 {
            background-color: rgba(99, 102, 241, 0.15) !important;
            color: #a5b4fc !important;
        }

        html.dark .text-indigo-600 {
            color: #818cf8 !important;
        }

        html.dark .hover\:bg-slate-50:hover {
            background-color: #334155 !important;
        }

        html.dark .hover\:bg-slate-100:hover {
            background-color: #475569 !important;
        }

        html.dark .hover\:bg-slate-200:hover {
            background-color: #64748b !important;
        }

        html.dark .hover\:shadow-md:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5) !important;
            border-color: #a78bfa !important;
        }

        html.dark .hover\:border-violet-300:hover {
            border-color: #8b5cf6 !important;
        }

        /* Modal background overlay */
        html.dark #modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
        }

        html.dark #modal-content {
            background-color: #1e293b;
            color: #f8fafc;
        }

        html.dark .divide-slate-100> :not([hidden])~ :not([hidden]) {
            border-color: #334155 !important;
        }

        html.dark table thead {
            background-color: #0f172a !important;
            color: #f8fafc !important;
        }

        html.dark table td,
        html.dark table th {
            border-color: #334155 !important;
        }

        /* Sweet Alert Dark Mode Fix */
        html.dark .swal2-popup {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border: 1px solid #334155 !important;
        }

        html.dark .swal2-title,
        html.dark .swal2-html-container {
            color: #f8fafc !important;
        }

        html.dark .swal2-input,
        html.dark .swal2-select,
        html.dark .swal2-textarea {
            background-color: #334155 !important;
            color: #f8fafc !important;
            border-color: #475569 !important;
        }

        html.dark .swal2-radio label {
            color: #f8fafc !important;
        }
    </style>
</head>

<body class="text-slate-800 h-screen flex overflow-hidden relative z-0 antialiased selection:bg-violet-500 selection:text-white">

                <button onclick="app.navigate('pos'); showCamera();"
                    class="hidden sm:inline-flex items-center gap-1.5 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-md shadow-violet-500/20 transition-all active:scale-95">
                    <i class="fa-solid fa-plus"></i> New Sale
                </button>

                <!-- User Profile & Logout Widget -->
                <div class="flex items-center gap-1.5 sm:gap-2 pl-1 sm:pl-2 border-l border-slate-200 dark:border-slate-700">
                    <div class="flex items-center gap-2 px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700">
                        <div class="w-6 h-6 rounded-full bg-violet-600 text-white flex items-center justify-center text-[10px] font-bold" id="user-avatar-initials">
                            A
                        </div>
                        <span id="user-display-name" class="text-xs font-bold text-slate-800 dark:text-slate-200 max-w-[80px] truncate hidden sm:inline">Admin</span>
                    </div>
                    <button onclick="app.logout()" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-red-50 dark:bg-red-900/30 hover:bg-red-100 text-red-600 dark:text-red-400 flex items-center justify-center border border-red-200/60 dark:border-red-800/40 transition-all" title="Logout">
                        <i class="fa-solid fa-right-from-bracket text-xs sm:text-sm"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Area (with responsive padding and mobile bottom margin) -->
        <div id="app-content" class="flex-1 overflow-y-auto p-3 sm:p-6 lg:p-8 pb-20 lg:pb-8 relative">
            <!-- Views will be injected here via JavaScript -->
        </div>

        <!-- Mobile Bottom Quick Navigation Bar (Shown only on small screens) -->
        <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 py-1.5 px-3 flex items-center justify-around shadow-lg">
            <button onclick="app.navigate('dashboard')" class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400 hover:text-violet-600 focus:text-violet-600 py-1 px-2">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[10px] font-bold">Home</span>
            </button>
            <button onclick="app.navigate('pos')" class="flex flex-col items-center gap-1 -mt-5 bg-gradient-to-tr from-violet-600 to-indigo-600 text-white p-3 rounded-2xl shadow-lg shadow-violet-500/30 active:scale-95 transition-all">
                <i class="fa-solid fa-cash-register text-lg"></i>
                <span class="text-[10px] font-black uppercase">POS</span>
            </button>
            <button onclick="app.navigate('products')" class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400 hover:text-violet-600 focus:text-violet-600 py-1 px-2">
                <i class="fa-solid fa-boxes-stacked text-lg"></i>
                <span class="text-[10px] font-bold">Items</span>
            </button>
            <button onclick="app.navigate('repairs')" class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400 hover:text-violet-600 focus:text-violet-600 py-1 px-2">
                <i class="fa-solid fa-screwdriver-wrench text-lg"></i>
                <span class="text-[10px] font-bold">Repairs</span>
            </button>
            <button onclick="app.toggleSidebar(true)" class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400 hover:text-violet-600 focus:text-violet-600 py-1 px-2">
                <i class="fa-solid fa-ellipsis text-lg"></i>
                <span class="text-[10px] font-bold">More</span>
            </button>
        </nav>
    </main>

    <!-- Barcode Scanner Modal for Mobile/Desktop Camera -->
    <div id="camera-section"
        class="hidden fixed inset-x-4 top-20 sm:inset-auto sm:bottom-10 sm:right-10 z-50 sm:w-80 bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700">
        <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-bold text-slate-800 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-camera text-violet-600"></i> Barcode Scanner
            </span>
            <button onclick="hideCamera()" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 hover:text-red-500 flex items-center justify-center">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>
        <div id="reader" class="rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-900 aspect-square"></div>
    </div>

    <!-- Generic Modal Container (Responsive) -->
    <div id="modal-overlay"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-4">
        <div id="modal-content"
            class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-2xl max-h-[92vh] overflow-y-auto transform transition-all scale-95 opacity-0 border border-slate-200 dark:border-slate-700">
            <!-- Modal content injected here -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>

</html>
